<!DOCTYPE html>
<html>
<head>
  <title>Smart Waste Segregation Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.10.0/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color:white; font-family:'Segoe UI'; text-align:center; padding:20px; margin:0;
    }
    h1 { text-shadow: 2px 2px 4px #000; font-size:32px; margin-bottom:5px; }
   .team { margin-bottom:20px; font-size:15px; opacity:0.9; }
   .container { display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin:20px 0; }
   .box {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
      padding:15px; border-radius:15px; width:110px; border:1px solid rgba(255,255,255,0.2);
      transition:0.3s;
    }
   .box:hover { transform: scale(1.05); }
   .box div { font-size:26px; font-weight:bold; margin:5px 0; }
    #result {
      font-size:24px; margin:20px auto; font-weight:bold; padding:15px;
      border-radius:10px; background:#6b7280; width:80%; max-width:400px;
      transition:0.3s;
    }
    #videoWrap { position:relative; display:inline-block; }
    canvas, video {
      border:4px solid #fff; border-radius:15px; background:black;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
    video { display:none; }
    #overlay { position:absolute; top:0; left:0; pointer-events:none; }
    button, input {
      padding:12px 20px; border-radius:8px; margin:8px; border:none;
      font-size:16px; cursor:pointer; font-weight:bold;
    }
    button { background:#22c55e; color:white; }
    button:hover { background:#16a34a; }
    #loadingMsg { font-size:14px; opacity:0.8; margin-top:10px; }
  </style>
</head>
<body>
  <h1>🤖 SMART WASTE SEGREGATION TRACKER</h1>
  <div class="team"><b>Team:</b> Prashanthi, Avinash, Pranay, Satya, Venkatesh</div>

  <div class="container">
    <div class="box">♻️<div id="plastic-count">0</div>Plastic</div>
    <div class="box">🌿<div id="wet-count">0</div>Wet</div>
    <div class="box">🔩<div id="metal-count">0</div>Metal</div>
    <div class="box">📄<div id="paper-count">0</div>Paper</div>
    <div class="box">🌍<div id="co2">0.00</div>CO2 kg</div>
  </div>

  <div id="videoWrap">
    <video id="video" width="400" height="300" autoplay playsinline></video>
    <canvas id="canvas" width="400" height="300"></canvas>
    <canvas id="overlay" width="400" height="300"></canvas>
  </div>
  <div id="result">⏳ AI MODEL LOAD AVUTUNDI... WAIT</div>
  <div id="loadingMsg"></div>
  <br>
  <input type="file" id="upload" accept="image/*">
  <button id="startBtn" disabled>▶️ Start Live Camera</button>
  <button id="stopBtn" style="display:none; background:#ef4444;">⏹️ Stop</button>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const overlay = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const octx = overlay.getContext('2d');
const resultDiv = document.getElementById('result');
const loadingMsg = document.getElementById('loadingMsg');
const upload = document.getElementById('upload');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
let counts = {plastic:0, wet:0, metal:0, paper:0};
let stream = null;
let detectInterval = null;
let model = null;
let lastCountedClass = null; // avoid double counting same object repeatedly

// MAP COCO-SSD classes to our 4 waste categories
const classMap = {
  "bottle": "plastic", "cup": "plastic", "wine glass": "plastic",
  "banana": "wet", "apple": "wet", "orange": "wet", "sandwich": "wet",
  "broccoli": "wet", "carrot": "wet", "pizza": "wet", "donut": "wet", "cake": "wet",
  "fork": "metal", "knife": "metal", "spoon": "metal", "scissors": "metal",
  "book": "paper", "cell phone": "paper" // fallback examples; extend as needed
};

const colors = { plastic:"#3b82f6", wet:"#22c55e", metal:"#ef4444", paper:"#f59e0b" };
const emojis = { plastic:"♻️ PLASTIC", wet:"🌿 WET WASTE", metal:"🔩 METAL", paper:"📄 PAPER" };

// LOAD MODEL ON PAGE LOAD
cocoSsd.load().then(loadedModel => {
  model = loadedModel;
  resultDiv.innerText = "✅ AI READY! Camera start cheyyi";
  resultDiv.style.background = "#22c55e";
  startBtn.disabled = false;
  loadingMsg.innerText = "";
}).catch(err => {
  loadingMsg.innerText = "Model load fail: " + err.message;
});

function updateCounts(){
  document.getElementById('plastic-count').innerText = counts.plastic;
  document.getElementById('wet-count').innerText = counts.wet;
  document.getElementById('metal-count').innerText = counts.metal;
  document.getElementById('paper-count').innerText = counts.paper;
  let co2 = (counts.plastic*0.5 + counts.wet*0.2 + counts.metal*0.8 + counts.paper*0.3).toFixed(2);
  document.getElementById('co2').innerText = co2;
}

async function detect(){
  if(!model) return;
  let source = video.style.display !== 'none' ? video : canvas;
  const predictions = await model.detect(source);

  octx.clearRect(0,0,overlay.width, overlay.height);

  if(predictions.length === 0){
    resultDiv.innerText = "🔍 SCANNING... vastuvu chupinchandi";
    resultDiv.style.background = "#6b7280";
    lastCountedClass = null;
    return;
  }

  // Take the prediction with highest confidence
  let best = predictions.reduce((a,b) => a.score > b.score ? a : b);
  let mapped = classMap[best.class] || null;

  // draw box
  octx.strokeStyle = "#00ffff";
  octx.lineWidth = 3;
  octx.strokeRect(...best.bbox);
  octx.fillStyle = "#00ffff";
  octx.font = "16px Arial";
  octx.fillText(best.class + " (" + Math.round(best.score*100) + "%)", best.bbox[0], best.bbox[1]-5);

  if(mapped){
    resultDiv.innerText = emojis[mapped] + " DETECTED (" + best.class + ")";
    resultDiv.style.background = colors[mapped];
    if(lastCountedClass !== best.class){
      counts[mapped]++;
      updateCounts();
      lastCountedClass = best.class;
    }
  } else {
    resultDiv.innerText = "❓ " + best.class + " (mapped kaledhu)";
    resultDiv.style.background = "#fbbf24";
    lastCountedClass = best.class;
  }
}

// UPLOAD FUNCTION
upload.addEventListener('change', function(e){
  video.style.display = "none"; canvas.style.display = "inline-block";
  stopCamera();
  let file = e.target.files[0]; if(!file) return;
  let img = new Image();
  img.onload = function(){
    canvas.width = 400; canvas.height = 300;
    ctx.drawImage(img, 0, 0, 400, 300);
    detect();
  }
  img.src = URL.createObjectURL(file);
});

// CAMERA FUNCTIONS
async function startCamera(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = stream; video.style.display = "inline-block";
    startBtn.style.display = "none"; stopBtn.style.display = "inline-block";
    detectInterval = setInterval(detect, 800);
  } catch(err) {
    resultDiv.innerText = "❌ Camera permission denied";
  }
}

function stopCamera(){
  if(stream){ stream.getTracks().forEach(track => track.stop()); }
  clearInterval(detectInterval);
  octx.clearRect(0,0,overlay.width, overlay.height);
  video.style.display = "none";
  startBtn.style.display = "inline-block";
  stopBtn.style.display = "none";
}

startBtn.addEventListener('click', startCamera);
stopBtn.addEventListener('click', stopCamera);
</script>
</body>
</html>
